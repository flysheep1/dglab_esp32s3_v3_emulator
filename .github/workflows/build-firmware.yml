name: Build ESP32-S3 Firmware

# 触发条件
on:
  push:
    branches: [ main ]      # push 到 main 时构建
    tags: [ 'v*' ]          # 打 v1.0.0 这样的标签时构建并发布 Release
  workflow_dispatch: {}     # 支持在 Actions 页面手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 用乐鑫官方 GitHub Action 拉取 ESP-IDF 5.2 容器编译（target=esp32s3）
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2
          target: esp32s3
          path: '.'

      # 把 bootloader + partition-table + app 合并成一个 merged.bin，方便用户一键烧录
      - name: Merge firmware to single bin
        run: |
          python -m esptool --chip esp32s3 merge_bin \
            -o merged.bin \
            --flash_mode dio --flash_size 4MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/dglab_esp32s3_v3_emulator.bin

      # 方式一：上传为 Action Artifact（登录后下载，90天有效，适合自己测试）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dglab_esp32s3_firmware
          path: |
            merged.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/dglab_esp32s3_v3_emulator.bin

      # 方式二：打 tag 时自动发布到 Release（公开永久，适合发布给用户）
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            merged.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          generate_release_notes: true
